[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nero-agent"
version = "1.0.0"
description = "NERO Autonomous AI Coding Agent CLI — Interactive REPL & Command Engine."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
nero = "agent.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: ruff check agent/ tests/

      - name: Run Ruff Formatter check
        run: ruff format --check agent/ tests/

      - name: Run Mypy Type Checker
        run: mypy agent/

      - name: Run Dependency Security Audit
        # Run pip-audit but ignore dev dependencies if preferred, or run on everything.
        # Running on everything ensures dev tools are secure too.
        run: pip-audit

      - name: Build Package (Source & Wheel)
        run: python -m build

      - name: Install Package from Wheel
        # Uninstall editable version first to ensure we test the clean built wheel
        run: |
          pip uninstall -y nero-agent
          # On Windows we use shell globbing or loop, on Unix we can use wildcards
          python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install'] + glob.glob('dist/*.whl'), check=True)"

      - name: CLI Smoke Test - Version & Help
        run: |
          nero --version
          nero --help

      - name: Run Unit Tests
        run: pytest
